name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tools:
    name: Tools and pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint the code
        run: ruff check .

      - name: Check the formatting
        run: ruff format --check .

      - name: Run the tests with coverage
        run: python -m pytest

  launcher:
    name: Entry point
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Maven Central limits how often a runner may fetch; the jars are checked against their pinned SHA-256
      # on every run, whether they come from the cache or from the network.
      - name: Restore the test tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/launcher-tests
          key: launcher-test-tools-${{ hashFiles('tests/launcher/run.sh') }}

      - name: Run the tests of the entry point with full coverage
        # The tests compile and run inside the JDK image of the build stage of the Dockerfile.
        run: ./tests/launcher/run.sh

      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-coverage
          path: build/launcher-tests/coverage
          if-no-files-found: ignore
          retention-days: 7
