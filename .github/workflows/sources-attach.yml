# Attaches the source archive to an existing release that does not have it, such as one published before the
# archive existed. A tag holds no sources.json of its own, so the run uses the list of main, and only when the
# Dockerfile of the tag pins the same vendor package as main: the same package has the same sources.
#
# The tag is checked before anything is built and reaches the workflow Sources only after that check; only
# the job that uploads may write to the repository.
name: Attach sources

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release that gets the archive, such as v2.12.4-1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sources-attach
  cancel-in-progress: false

jobs:
  check:
    name: Check the release tag and its package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Check the release tag and its package
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Run this workflow from main: it uses the source list of main."
            exit 1
          fi
          # The scheme of the tag and the version of the package on main.
          python -m hibiscus_image release-check --ref "refs/tags/$TAG"
          if ! git fetch --quiet --depth 1 --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"; then
            echo "::error::The tag $TAG does not exist."
            exit 1
          fi
          # The same vendor package, by version and SHA-256, has the same sources.
          git show "refs/tags/$TAG:Dockerfile" > "$RUNNER_TEMP/tag.Dockerfile"
          if ! python -m hibiscus_image same-package "$RUNNER_TEMP/tag.Dockerfile"; then
            echo "::error::The tag $TAG pins another vendor package than main; its sources are not the ones of main."
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"; then
            echo "::error::The tag $TAG has no release."
            exit 1
          fi
          if grep -Fxq "hibiscus-server-$TAG-sources.tar.gz" "$RUNNER_TEMP/assets.txt"; then
            echo "::error::The release $TAG has its source archive already; an asset is never replaced."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  sources:
    name: Sources
    needs: check
    permissions:
      contents: read
    uses: $/.github/workflows/sources.yml
    with:
      label: ${{ needs.check.outputs.tag }}

  attach:
    name: Attach the source archive to the release
    needs: [check, sources]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the release asset
    steps:
      - name: Download the source archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-archive
          path: ${{ runner.temp }}/sources

      - name: Attach the source archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # Without --clobber, gh refuses to replace an asset of the same name.
          gh release upload "$TAG" "$RUNNER_TEMP/sources/hibiscus-server-$TAG-sources.tar.gz" --repo "$GITHUB_REPOSITORY"
